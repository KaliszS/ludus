[package]
name = "ludusd"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Sebastian Kalisz"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
diesel = { version = "2.3.12", default-features = false, features = ["postgres_backend", "uuid", "chrono"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
